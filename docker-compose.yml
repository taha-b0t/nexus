services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: nexus, POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus_dev_only}
    command: ["postgres","-c","wal_level=logical"]  # logical WAL = Debezium CDC can read it
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data","./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nexus"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["full"]
    ports: ["9092:9092"]
    environment: {KAFKA_NODE_ID: 1, KAFKA_PROCESS_ROLES: "broker,controller", KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093", KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER", CLUSTER_ID: "nexus-cluster-1"}
  prometheus:
    image: prom/prometheus:latest
    profiles: ["full"]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    profiles: ["full"]
    ports: ["3000:3000"]
volumes: {pgdata: {}, miniodata: {}}

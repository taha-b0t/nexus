services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: nexus, POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus_dev_only}
    command: ["postgres","-c","wal_level=logical"]  # logical WAL = Debezium CDC can read it
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data","./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nexus"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["full"]
    ports: ["9092:9092"]
    # Single-node KRaft: broker + controller in one process. The defaults for the
    # internal topics ask for 3 replicas, which one broker cannot satisfy, so all
    # replication factors are pinned to 1 (dev only — never ship RF=1).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "nexus-cluster-1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created explicitly, see kafka-init
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"  # laptop-sized; raise on real hardware
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL","kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
  # Creates the nexus.* topics from infra/kafka/topics.yaml (one-shot, exits 0).
  kafka-init:
    image: apache/kafka:3.7.0
    profiles: ["full"]
    depends_on: {kafka: {condition: service_healthy}}
    volumes: ["./infra/kafka/create-topics.sh:/create-topics.sh:ro"]
    command: ["sh","/create-topics.sh","kafka:9092"]
  # Debezium Kafka Connect: runs the Postgres CDC connector (Phase 2).
  # Register it with: curl -X POST localhost:8083/connectors -H 'Content-Type: application/json' -d @infra/debezium/register-connector.json
  connect:
    image: quay.io/debezium/connect:2.7
    profiles: ["full"]
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "nexus-connect"
      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-status"
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xmx512M -Xms512M"  # debezium/connect default is 2G; laptop-sized
  prometheus:
    image: prom/prometheus:latest
    profiles: ["full"]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    profiles: ["full"]
    ports: ["3000:3000"]
volumes: {pgdata: {}, miniodata: {}, kafkadata: {}}
